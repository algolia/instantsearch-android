plugins {
    id 'com.android.application'
    id 'kotlinx-serialization'
}

android {
    compileSdk = libs.versions.android.compileSdk.get().toInteger()
    namespace = "com.algolia.instantsearch.example.wearos"

    defaultConfig {
        applicationId = "com.algolia.instantsearch.example.wearos"
        minSdk = 30
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

// AGP 9 built-in Kotlin: compiler options replace `kotlinOptions` and the
// `kotlin-android` plugin.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        optIn.add('kotlinx.serialization.InternalSerializationApi')
    }
}

dependencies {
    //implementation "com.algolia:instantsearch-android:$instantsearch"
    implementation project(":instantsearch")

    implementation 'androidx.wear:wear:1.4.0'
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation "io.coil-kt:coil:2.7.0"
}
