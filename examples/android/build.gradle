apply plugin: 'com.android.application'
apply plugin: 'kotlinx-serialization'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    compileSdk = libs.versions.android.compileSdk.get().toInteger()
    namespace = "com.algolia.instantsearch.examples.android"

    defaultConfig {
        applicationId = "com.algolia.instantsearch.examples.android"
        minSdk = libs.versions.android.minSdk.get().toInteger()
        targetSdk = 37
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            matchingFallbacks = ['release']
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/kotlinx_coroutines_core.version']
        }
    }
    buildFeatures {
        viewBinding = true
        compose = true
    }
}

// AGP 9 built-in Kotlin: compiler options replace `kotlinOptions` and the
// `kotlin-android` plugin.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        optIn.addAll(
            'kotlin.RequiresOptIn',
            'com.algolia.instantsearch.ExperimentalInstantSearch',
            'androidx.compose.material.ExperimentalMaterialApi',
            'kotlinx.serialization.InternalSerializationApi',
            'com.algolia.instantsearch.agent.ExperimentalAgentStudioApi',
        )
    }
}

dependencies {
    //implementation "com.algolia:instantsearch-android:$instantsearch"
    implementation project(":instantsearch")
    //implementation "com.algolia:instantsearch-compose:$instantsearch"
    implementation project(":instantsearch-compose")
    //implementation "com.algolia:instantsearch-insights-android:$instantsearch"
    implementation project(":instantsearch-insights")
    //implementation "com.algolia:instantsearch-android-paging3:$instantsearch"
    implementation project(":extensions:android-paging3")
    //implementation "com.algolia:instantsearch-android-loading:$instantsearch"
    implementation project(":extensions:android-loading")
    // Experimental, standalone agent SDK (versioned independently, 0.x).
    implementation project(":instantsearch-agent")
    implementation "com.algolia.instantsearch:voice:1.1.0"

    implementation "androidx.fragment:fragment-ktx:1.9.1"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.2"
    implementation libs.google.material

    implementation libs.androidx.compose.ui
    implementation "androidx.compose.ui:ui-tooling-preview:${libs.versions.composeUi.get()}"
    implementation libs.androidx.compose.material
    implementation libs.androidx.compose.material.icons.extended
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.paging:paging-compose:3.5.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'com.google.accompanist:accompanist-swiperefresh:0.36.0'

    debugImplementation "androidx.compose.ui:ui-tooling:${libs.versions.composeUi.get()}"
    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"

    testImplementation libs.junit
    androidTestImplementation libs.test.androidx.runner
    androidTestImplementation libs.test.androidx.espresso
}
